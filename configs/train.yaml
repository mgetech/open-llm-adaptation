# Settings for the QLoRA fine-tuning. These are starting values. Each run writes the values it
# used into its manifest.

quantisation:
  quant_type: nf4
  double_quant: true
  compute_dtype: float16  # a T4 has no bf16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

optimiser:
  learning_rate: 0.0002
  lr_scheduler: cosine
  warmup_ratio: 0.03
  epochs: 1  # round 3 has 6000 training documents, the same passes as 2 epochs of 3000
  optim: paged_adamw_8bit
  batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

data:
  max_length: 1280  # tokens of prompt and answer together. A longer example stops the run.

checkpoint:
  save_steps: 75  # a checkpoint every 75 steps, and none is deleted: 375 steps leave five

# The run trains every step. Afterwards `make select` scores these checkpoints on the dev_real
# documents with the whole pipeline and keeps the one with the lowest critical error rate. The
# documents are never trained on.
selection:
  steps: [150, 225, 300, 375]

logging_steps: 10

# `--smoke`: a tiny random model and a tiny tokenizer, built here, on the CPU, without
# quantisation. It checks the code path and needs no download.
smoke:
  steps: 2
  examples: 16
  tokenizer_examples: 200  # records the tiny tokenizer is trained on
  batch_size: 2
  max_length: 4096  # the tiny tokenizer has few merges, so the same text is longer
  save_steps: 1
  vocab_size: 1000
  hidden_size: 64
  intermediate_size: 128
  layers: 2
  heads: 4
  kv_heads: 2
  head_dim: 16
