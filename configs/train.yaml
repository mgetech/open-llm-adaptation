# Settings for the QLoRA fine-tuning. These are starting values. Each run writes the values it
# used into its manifest.

quantisation:
  quant_type: nf4
  double_quant: true
  compute_dtype: float16  # a T4 has no bf16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

optimiser:
  learning_rate: 0.0002
  lr_scheduler: cosine
  warmup_ratio: 0.03
  epochs: 1  # round 3 has 6000 training documents, the same passes as 2 epochs of 3000
  optim: paged_adamw_8bit
  batch_size: 4
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

data:
  max_length: 1024  # tokens of prompt and answer together. A longer example stops the run.

checkpoint:
  save_steps: 50  # the dev_real loss is measured each time a checkpoint is saved
  keep: 2

# The loss on the dev_real documents decides when to stop and which checkpoint is kept. The
# documents are never trained on. Without a dev_real file the run trains all its steps.
early_stopping:
  patience: 3  # checkpoints in a row without a better loss
  min_delta: 0.0  # how much lower the loss must be to count as better

logging_steps: 10

# `--smoke`: a tiny random model and a tiny tokenizer, built here, on the CPU, without
# quantisation. It checks the code path and needs no download.
smoke:
  steps: 2
  examples: 16
  eval_examples: 4  # dev_real documents the loss is measured on
  tokenizer_examples: 200  # records the tiny tokenizer is trained on
  batch_size: 2
  max_length: 4096  # the tiny tokenizer has few merges, so the same text is longer
  save_steps: 1
  vocab_size: 1000
  hidden_size: 64
  intermediate_size: 128
  layers: 2
  heads: 4
  kv_heads: 2
  head_dim: 16
