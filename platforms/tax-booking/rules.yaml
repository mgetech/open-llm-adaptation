  - {number: "4805", name: Repairs and maintenance, group: operating_expense}
  - {number: "4910", name: Postage and shipping, group: operating_expense}
  - {number: "4920", name: Telephone and internet, group: operating_expense}
  - {number: "4930", name: Office supplies, group: operating_expense}
