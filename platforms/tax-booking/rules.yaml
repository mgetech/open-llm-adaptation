# Fictional supplier names: two or three syllables plus a legal form that fits
# the supplier's country.
supplier_names:
  syllables: [ba, ber, cal, dan, dur, eks, fal, fin, gor, gro, hal, hin, jor, kas, ko,
              lar, lon, mel, mir, nik, nor, pen, pra, ri, sol, ten, tu, vel, vor, zan]
  suffixes:
    DE: [GmbH, AG, KG, "GmbH & Co. KG", e.K., UG]
    EU: [B.V., S.A., s.r.o., sp. z o.o., S.L., S.r.l.]
    non-EU: [Inc., LLC, Ltd, Corp.]

