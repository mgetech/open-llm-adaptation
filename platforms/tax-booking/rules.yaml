# Booking rules for the synthetic data. The chart is an illustrative subset of
# SKR03 and the supplier types are made up. This is not tax advice.
#
# Item prices are the amount printed on the document, in EUR. For suppliers in
# the EU and outside the EU the document is a reverse-charge invoice and the
# price is net. Expense prices stay well below the asset limit and asset prices
# well above it, so the near-limit check only fires on purpose.
#
# Layouts: a shop prints a receipt, a trade supplier prints an invoice, and a
# provider of a recurring service prints a statement. Foreign suppliers write
# any invoice layout, with a reverse-charge note.

chart: SKR03

accounts:
  - {number: "0410", name: Business equipment, group: asset, asset: true}
  - {number: "0480", name: Low-value assets, group: asset, asset: true}
