# Booking rules for the synthetic data. The chart is an illustrative subset of
# SKR03 and the supplier types are made up. This is not tax advice.
#
# Item prices are the amount printed on the document, in EUR. For suppliers in
# the EU and outside the EU the document is a reverse-charge invoice and the
# price is net. Expense prices stay well below the asset limit and asset prices
# well above it, so the near-limit check only fires on purpose.

chart: SKR03

accounts:
  - {number: "0410", name: Business equipment, group: asset, asset: true}
  - {number: "0480", name: Low-value assets, group: asset, asset: true}
  - {number: "0650", name: Office furniture, group: asset, asset: true}
  - {number: "1800", name: Private withdrawals, group: private}
  - {number: "2100", name: Interest expense, group: financial}
  - {number: "3300", name: Goods for resale (reduced rate), group: goods}
  - {number: "3400", name: Goods for resale (standard rate), group: goods}
  - {number: "4210", name: Rent, group: operating_expense}
  - {number: "4240", name: "Electricity, gas and water", group: operating_expense}
  - {number: "4250", name: Cleaning, group: operating_expense}
  - {number: "4360", name: Insurance, group: operating_expense}
  - {number: "4530", name: Vehicle running costs, group: operating_expense}
